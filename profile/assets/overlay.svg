    <text x="22.0" y="378" fill="#E5E7EB">extends: /specs/openapi-v1.yaml</text>
    <text x="22.0" y="400" fill="#E5E7EB">actions:</text>
    <text x="38.9" y="422" fill="#E5E7EB">- target: $['info']</text>
    <text x="55.7" y="444" fill="#E5E7EB">update:</text>
    <text x="72.6" y="466" fill="#E5E7EB">description: Buy and manage museum tickets.</text>
