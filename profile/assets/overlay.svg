  <text x="74" y="22" fill="#9CA3AF" font-family="'Fira Code',Monaco,Consolas,ui-monospace,SFMono-Regular,Menlo,'Liberation Mono',monospace" font-size="12">speclynx overlay</text>
  <g font-family="'Fira Code',Monaco,Consolas,ui-monospace,SFMono-Regular,Menlo,'Liberation Mono',monospace" font-size="14" xml:space="preserve">
    <text x="22.0" y="70" fill="#AEB6C2">$ </text><text x="38.9" y="70" fill="#34D399" font-weight="700">npx @speclynx/cli overlay apply </text><text x="308.6" y="70" fill="#C9D1D9">add-contact.yaml museum.yaml</text>
