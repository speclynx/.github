    <text x="38.9" y="180" fill="#E5E7EB">contact:</text>
    <text x="55.7" y="202" fill="#E5E7EB">email: api@museum.example</text>
    <text x="22.0" y="224" fill="#E5E7EB">paths: {}</text>
    
    <text x="22.0" y="268" fill="#AEB6C2">$ </text><text x="38.9" y="268" fill="#34D399" font-weight="700">npx @speclynx/cli overlay diff </text><text x="300.2" y="268" fill="#C9D1D9">openapi-v1.yaml openapi-v2.yaml</text>
    <text x="22.0" y="290" fill="#E5E7EB">overlay: 1.2.0</text>
